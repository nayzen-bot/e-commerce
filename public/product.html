<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produit - shopTonIDF</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="navbar-brand"><span>🛍️</span><span>shopTonIDF</span></a>
                <button class="mobile-menu-toggle"><span></span><span></span><span></span></button>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">Accueil</a></li>
                    <li><a href="/catalog" class="nav-link">Catalogue</a></li>
                    <li><a href="/legal" class="nav-link">Informations</a></li>
                    <li><a href="/cart" class="nav-link" style="position: relative;">🛒 Panier<span
                                class="cart-badge">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="product-detail" class="container mt-3xl mb-3xl">
        <div class="skeleton" style="height: 400px;"></div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 shopTonIDF. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function loadProductDetail() {
            const productId = window.location.pathname.split('/').pop();

            try {
                Animations.showLoading();
                const response = await API.getProduct(productId);

                if (response.success) {
                    const product = response.product;
                    const container = document.getElementById('product-detail');

                    container.innerHTML = `
            <div class="grid grid-cols-2 gap-xl">
              <div class="product-image" style="height: 500px; border-radius: 1rem;">
                ${product.featured ? '<span class="product-badge">⭐ Vedette</span>' : ''}
                📦
              </div>
              
              <div>
                <div class="badge badge-secondary mb-md">${product.category}</div>
                <h1 class="mb-md">${product.name}</h1>
                <p class="text-secondary mb-lg" style="font-size: 1.125rem;">${product.description}</p>
                
                <div class="card mb-lg">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="product-price" style="font-size: 2.5rem;">${AppUtils.formatCurrency(product.price)}</div>
                      <div class="product-stock ${product.stock < 10 ? 'low' : product.stock === 0 ? 'out' : ''}">
                        ${product.stock > 0 ? product.stock + ' unités disponibles' : 'Rupture de stock'}
                      </div>
                    </div>
                  </div>
                </div>
                
                <div class="flex gap-md">
                  <input type="number" id="quantity" value="1" min="1" max="${product.stock}" class="form-input" style="width: 100px;">
                  <button class="btn btn-primary btn-lg flex-1" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>
                    🛒 Ajouter au panier
                  </button>
                </div>
                
                <div class="mt-lg">
                  <a href="/catalog" class="btn btn-outline">← Retour au catalogue</a>
                </div>
              </div>
            </div>
          `;
                }

                Animations.hideLoading();
            } catch (error) {
                Animations.hideLoading();
                Animations.showError('Erreur lors du chargement');
            }
        }

        async function addToCart(productId) {
            try {
                const quantity = parseInt(document.getElementById('quantity').value);
                const response = await API.getProduct(productId);

                if (response.success) {
                    Cart.addItem(response.product, quantity);
                    Animations.showSuccess('Produit ajouté au panier !');
                }
            } catch (error) {
                Animations.showError('Erreur lors de l\'ajout');
            }
        }

        loadProductDetail();
    </script>
</body>

</html>
