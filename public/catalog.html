<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue - shopTonIDF</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="navbar-brand"><span>🛍️</span><span>shopTonIDF</span></a>
                <button class="mobile-menu-toggle"><span></span><span></span><span></span></button>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">Accueil</a></li>
                    <li><a href="/catalog" class="nav-link">Catalogue</a></li>
                    <li><a href="/legal" class="nav-link">Informations</a></li>
                    <li><a href="/cart" class="nav-link" style="position: relative;">🛒 Panier<span
                                class="cart-badge">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container mt-3xl mb-3xl">
        <h1 class="text-center mb-xl">Notre Catalogue</h1>

        <div class="flex justify-center gap-md mb-xl">
            <button class="btn btn-outline" onclick="filterByCategory('')">Tous</button>
            <button class="btn btn-outline" onclick="filterByCategory('Electronics')">Électronique</button>
            <button class="btn btn-outline" onclick="filterByCategory('Clothing')">Vêtements</button>
            <button class="btn btn-outline" onclick="filterByCategory('Accessories')">Accessoires</button>
        </div>

        <div id="products-grid" class="grid grid-cols-3 gap-lg">
            <div class="skeleton" style="height: 400px;"></div>
            <div class="skeleton" style="height: 400px;"></div>
            <div class="skeleton" style="height: 400px;"></div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 shopTonIDF. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let allProducts = [];

        async function loadProducts() {
            try {
                Animations.showLoading();
                const response = await API.getProducts();

                if (response.success) {
                    allProducts = response.products;
                    displayProducts(allProducts);
                }

                Animations.hideLoading();
            } catch (error) {
                Animations.hideLoading();
                Animations.showError('Erreur lors du chargement');
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('products-grid');
            container.innerHTML = products.map(product => `
        <div class="product-card fade-in-up">
          <div class="product-image">
            ${product.featured ? '<span class="product-badge">⭐</span>' : ''}
            📦
          </div>
          <div class="product-content">
            <div class="product-category">${product.category}</div>
            <h3 class="product-title">${product.name}</h3>
            <p class="product-description">${product.description}</p>
            <div class="product-footer">
              <div>
                <div class="product-price">${AppUtils.formatCurrency(product.price)}</div>
                <div class="product-stock ${product.stock < 10 ? 'low' : product.stock === 0 ? 'out' : ''}">
                  ${product.stock > 0 ? product.stock + ' en stock' : 'Rupture de stock'}
                </div>
              </div>
              <button class="btn btn-primary" onclick="window.location.href='/product/${product.id}'">Voir</button>
            </div>
          </div>
        </div>
      `).join('');
        }

        function filterByCategory(category) {
            const filtered = category ? allProducts.filter(p => p.category === category) : allProducts;
            displayProducts(filtered);
        }

        loadProducts();
    </script>
</body>

</html>
