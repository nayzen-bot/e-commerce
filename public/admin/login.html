<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - shopTonIDF</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="admin-login-page">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">🔐 Administration</h1>
                <p class="login-subtitle">shopTonIDF</p>
            </div>

            <form id="login-form" class="login-form" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="admin-email" class="form-input" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" id="admin-password" class="form-input" required
                        autocomplete="current-password">
                </div>

                <div id="login-error" class="form-error" style="display: none;"></div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    Se connecter
                </button>
            </form>

            <div class="text-center mt-lg">
                <a href="/" class="text-secondary">← Retour au site</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/admin.js"></script>
</body>

</html>
