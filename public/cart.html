<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - shopTonIDF</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="navbar-brand"><span>🛍️</span><span>shopTonIDF</span></a>
                <button class="mobile-menu-toggle"><span></span><span></span><span></span></button>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">Accueil</a></li>
                    <li><a href="/catalog" class="nav-link">Catalogue</a></li>
                    <li><a href="/legal" class="nav-link">Informations</a></li>
                    <li><a href="/cart" class="nav-link" style="position: relative;">🛒 Panier<span
                                class="cart-badge">0</span></a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container mt-3xl mb-3xl">
        <h1 class="mb-xl">Votre Panier</h1>

        <div class="grid grid-cols-3 gap-xl">
            <div style="grid-column: span 2">
                <div id="cart-items"></div>
            </div>

            <div>
                <div class="card">
                    <h3 class="card-title">Résumé de la commande</h3>
                    <div class="card-body">
                        <div class="flex justify-between mb-md">
                            <span>Sous-total:</span>
                            <span id="cart-subtotal" class="font-bold">€0.00</span>
                        </div>
                        <div class="flex justify-between mb-md">
                            <span>Livraison:</span>
                            <span class="text-success font-bold">Gratuite</span>
                        </div>
                        <hr>
                        <div class="flex justify-between mt-md">
                            <span class="font-bold">Total:</span>
                            <span id="cart-total" class="font-bold text-primary" style="font-size: 1.5rem;">€0.00</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button onclick="window.location.href='/checkout'" class="btn btn-primary btn-block btn-lg"
                            id="checkout-btn">
                            Commander
                        </button>
                        <a href="/catalog" class="btn btn-outline btn-block mt-md">Continuer mes achats</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 shopTonIDF. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/animations.js"></script>
    <script src="/js/app.js"></script>
    <script>
        function renderCart() {
            const items = Cart.getItems();
            const container = document.getElementById('cart-items');

            if (items.length === 0) {
                container.innerHTML = `
          <div class="card text-center p-3xl">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🛒</div>
            <h3>Votre panier est vide</h3>
            <p class="mb-lg">Découvrez notre catalogue pour commencer vos achats</p>
            <a href="/catalog" class="btn btn-primary">Voir le catalogue</a>
          </div>
        `;
                document.getElementById('checkout-btn').disabled = true;
            } else {
                container.innerHTML = items.map(item => `
          <div class="cart-item">
            <div class="cart-item-image">📦</div>
            <div class="cart-item-details">
              <h3 class="cart-item-title">${item.name}</h3>
              <div class="cart-item-price">${AppUtils.formatCurrency(item.price)}</div>
              <div class="cart-item-controls">
                <div class="quantity-control">
                  <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                  <span class="quantity-value">${item.quantity}</span>
                  <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                </div>
                <button class="btn btn-sm btn-ghost" onclick="removeItem(${item.id})">🗑️ Supprimer</button>
              </div>
            </div>
          </div>
        `).join('');
                document.getElementById('checkout-btn').disabled = false;
            }

            const total = Cart.getTotal();
            document.getElementById('cart-subtotal').textContent = AppUtils.formatCurrency(total);
            document.getElementById('cart-total').textContent = AppUtils.formatCurrency(total);
        }

        function updateQuantity(productId, newQuantity) {
            if (newQuantity < 1) return;
            Cart.updateQuantity(productId, newQuantity);
            renderCart();
        }

        function removeItem(productId) {
            Cart.removeItem(productId);
            renderCart();
            Animations.showSuccess('Produit retiré du panier');
        }

        // Wait for Cart to be initialized before rendering
        document.addEventListener('DOMContentLoaded', () => {
            // Give Cart.init() time to complete
            setTimeout(() => {
                renderCart();
            }, 100);
        });
    </script>
</body>

</html>
