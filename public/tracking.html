<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de commande - shopTonIDF</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <nav class="navbar">
                <a href="/" class="navbar-brand"><span>🛍️</span><span>shopTonIDF</span></a>
                <button class="mobile-menu-toggle"><span></span><span></span><span></span></button>
                <ul class="nav-links">
                    <li><a href="/" class="nav-link">Accueil</a></li>
                    <li><a href="/catalog" class="nav-link">Catalogue</a></li>
                    <li><a href="/tracking" class="nav-link">Suivi</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container mt-3xl mb-3xl">
        <h1 class="text-center mb-xl">Suivre ma commande</h1>

        <div class="card" style="max-width:600px; margin: 0 auto;">
            <h3 class="card-title">Entrez votre numéro de commande</h3>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">Numéro de commande</label>
                    <input type="number" id="order-id-input" class="form-input" placeholder="ex: 123">
                </div>
                <button onclick="trackOrder()" class="btn btn-primary btn-block">Suivre</button>
            </div>
        </div>

        <div id="order-status" class="mt-xl" style="display: none;"></div>
    </section>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script>
        async function trackOrder() {
            const orderId = document.getElementById('order-id-input').value;

            if (!orderId) {
                alert('Veuillez entrer un numéro de commande');
                return;
            }

            try {
                const response = await API.trackOrder(orderId);

                if (response.success) {
                    const order = response.order;
                    const container = document.getElementById('order-status');

                    container.innerHTML = `
            <div class="card scale-in">
              <h3 class="card-title">Commande #${order.id}</h3>
              <div class="card-body">
                <div class="mb-md">
                  <strong>Statut du paiement:</strong>
                  <span class="badge ${order.payment_status === 'verified' ? 'badge-success' : order.payment_status === 'failed' ? 'badge-error' : 'badge-warning'}">
                    ${order.payment_status === 'verified' ? '✅ Vérifié' : order.payment_status === 'failed' ? '❌ Échoué' : '⏳ En attente'}
                  </span>
                </div>
                <div class="mb-md">
                  <strong>Statut de livraison:</strong>
                  <span class="badge ${order.delivery_status === 'delivered' ? 'badge-success' : order.delivery_status === 'shipped' ? 'badge-info' : 'badge-warning'}">
                    ${order.delivery_status === 'delivered' ? '✅ Livré' : order.delivery_status === 'shipped' ? '🚚 Expédié' : order.delivery_status === 'preparing' ? '📦 En préparation' : '⏳ En attente'}
                  </span>
                </div>
                <div>
                  <strong>Date de commande:</strong> ${AppUtils.formatDate(order.created_at)}
                </div>
              </div>
            </div>
          `;

                    container.style.display = 'block';
                }
            } catch (error) {
                alert('Commande introuvable');
            }
        }
    </script>
</body>

</html>
